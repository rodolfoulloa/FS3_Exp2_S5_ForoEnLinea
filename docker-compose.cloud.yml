# Ágora · despliegue en la nube (Play with Docker u otro host con Docker)
# Usa las imágenes ya publicadas en Docker Hub (Container Registry): no compila nada.
#   docker compose -f docker-compose.cloud.yml up -d
# En la instancia se necesitan solo este archivo, el .env y la carpeta wallet/.
# La memoria de Java se limita (JAVA_TOOL_OPTIONS) porque la instancia de la nube es pequeña.
services:
  ms-usuarios:
    image: ${DOCKERHUB_USER}/agora-ms-usuarios:${VERSION:-1.0.0}
    env_file: .env
    environment:
      JAVA_TOOL_OPTIONS: "-Xmx256m -Xss512k -XX:+UseSerialGC"
    volumes:
      - ./wallet:/app/wallet:ro
    ports:
      - "8081:8081"
    restart: unless-stopped

  ms-foro:
    image: ${DOCKERHUB_USER}/agora-ms-foro:${VERSION:-1.0.0}
    env_file: .env
    environment:
      JAVA_TOOL_OPTIONS: "-Xmx256m -Xss512k -XX:+UseSerialGC"
      MS_USUARIOS_URL: http://ms-usuarios:8081
    volumes:
      - ./wallet:/app/wallet:ro
    ports:
      - "8082:8082"
    depends_on:
      - ms-usuarios
    restart: unless-stopped

  ms-moderacion:
    image: ${DOCKERHUB_USER}/agora-ms-moderacion:${VERSION:-1.0.0}
    env_file: .env
    environment:
      JAVA_TOOL_OPTIONS: "-Xmx256m -Xss512k -XX:+UseSerialGC"
      MS_USUARIOS_URL: http://ms-usuarios:8081
      MS_FORO_URL: http://ms-foro:8082
    volumes:
      - ./wallet:/app/wallet:ro
    ports:
      - "8083:8083"
    depends_on:
      - ms-usuarios
      - ms-foro
    restart: unless-stopped

  frontend:
    image: ${DOCKERHUB_USER}/agora-frontend:${VERSION:-1.0.0}
    ports:
      - "80:80"
    restart: unless-stopped
