spring.application.name=ms-foro
server.port=8082

# ===== Conexión a Oracle Autonomous Database (Oracle Cloud) =====
# Los valores se leen desde variables de entorno para no subir credenciales a Git.
#   DB_SERVICE : nombre del servicio del wallet (ver tnsnames.ora, ej: fs3db_tp)
#   TNS_ADMIN  : ruta a la carpeta descomprimida del wallet
#   DB_USER    : usuario de la BD
#   DB_PASSWORD: clave del usuario
# Alternativa: crear application-local.properties (no se sube) y ejecutar con el perfil "local".
spring.datasource.url=jdbc:oracle:thin:@${DB_SERVICE:fs3db_tp}?TNS_ADMIN=${TNS_ADMIN:./wallet}
spring.datasource.username=${DB_USER:ADMIN}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# ===== JPA / Hibernate =====
# update: crea/actualiza la tabla automáticamente si no existe
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# ===== CORS (orígenes permitidos, separados por coma) =====
app.cors.origenes=${APP_CORS_ORIGENES:*}

# ===== Actuator: GET /actuator/health para monitoreo y Docker =====
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

# ===== Microservicios de los que depende =====
# ms-usuarios: valida al autor (existe y está activo) y el rol ADMIN para moderar
usuarios.service.url=${MS_USUARIOS_URL:http://localhost:8081}
