server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Archivos estáticos con caché larga (llevan hash en el nombre)
    location ~* \.(js|css|svg|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Fallback de SPA: cualquier ruta de Angular (/temas/3, /admin/reportes) carga index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
